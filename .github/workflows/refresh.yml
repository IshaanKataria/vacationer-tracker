name: weekly data refresh

on:
  schedule:
    # Tuesdays 19:47 UTC = Wednesday ~6:47am AEST (off-peak minute — GitHub
    # delays jobs scheduled at the top of the hour)
    - cron: "47 19 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: install deps
        run: npm ci

      - name: run AI research refresh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/refresh.mjs

      # Commit refreshed data straight to main so it auto-deploys via Vercel —
      # no PR to merge by hand. The script's schema validation + suspicious-
      # shrink guard already fail the run before this step on bad output, so
      # only validated data reaches main.
      - name: commit refreshed data to main
        run: |
          if git diff --quiet -- data/programs.json; then
            echo "no data changes this run — nothing to deploy"
            exit 0
          fi
          git config user.name "vacationer-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/programs.json
          git commit -m "chore: weekly program data refresh ($(date -u +%Y-%m-%d))"
          git push origin HEAD:main
